<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes App</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; padding: 2rem 1rem; color: #1f2933; }
  .card { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  h1 { margin-top: 0; font-size: 1.4rem; }
  form { display: flex; gap: .5rem; }
  input { flex: 1; padding: .6rem; border: 1px solid #cbd2d9; border-radius: 6px; font-size: 1rem; }
  button { padding: .6rem 1rem; border: 0; border-radius: 6px; background: #0b69c7; color: #fff; font-size: 1rem; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 1.2rem 0 0; }
  li { padding: .6rem 0; border-bottom: 1px solid #e4e7eb; }
  small { color: #7b8794; display: block; }
  #msg { color: #c53030; min-height: 1.2em; margin: .6rem 0 0; }
</style>
</head>
<body>
<div class="card">
  <h1>Notes App</h1>
  <form id="form">
    <input id="content" maxlength="500" placeholder="Write a note..." required>
    <button type="submit">Add</button>
  </form>
  <p id="msg"></p>
  <ul id="list"></ul>
</div>
<script>
const list = document.getElementById('list');
const msg = document.getElementById('msg');
const input = document.getElementById('content');

async function loadNotes() {
  try {
    const res = await fetch('/api/notes');
    if (!res.ok) throw new Error('Server error ' + res.status);
    const notes = await res.json();
    list.innerHTML = '';
    notes.forEach(n => {
      const li = document.createElement('li');
      li.textContent = n.content;              // textContent => XSS safe
      const small = document.createElement('small');
      small.textContent = new Date(n.created_at).toLocaleString();
      li.appendChild(small);
      list.appendChild(li);
    });
    msg.textContent = '';
  } catch (e) {
    msg.textContent = 'Could not load notes: ' + e.message;
  }
}

document.getElementById('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  try {
    const res = await fetch('/api/notes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: input.value })
    });
    if (!res.ok) throw new Error('Server error ' + res.status);
    input.value = '';
    loadNotes();
  } catch (e) {
    msg.textContent = 'Could not add note: ' + e.message;
  }
});

loadNotes();
</script>
</body>
</html>
