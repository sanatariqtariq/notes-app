name: CI-CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  RG: rg-notes-cea

jobs:
  # 1) TEST: poora 3-tier stack docker compose se chala kar smoke tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for test (dummy credentials)
        run: cp .env.example .env

      - name: Start stack
        run: docker compose up -d --build

      - name: Run smoke tests
        run: bash scripts/smoke_test.sh http://localhost:8080

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v

  # 2) BUILD + PUSH: sirf test pass hone par
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR paths lowercase hone chahiye
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/notes-app:latest
            ghcr.io/${{ env.OWNER }}/notes-app:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/notes-web:latest
            ghcr.io/${{ env.OWNER }}/notes-web:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  # 3) DEPLOY: Azure VMSS par naya image
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Redeploy to VM Scale Sets
        run: bash infra/redeploy.sh

      - name: Verify live application
        run: |
          IP=$(az network public-ip show -g "$RG" -n pip-lb-web --query ipAddress -o tsv)
          for i in $(seq 1 20); do
            if curl -fsS "http://$IP/api/health"; then echo; echo "Live app healthy"; exit 0; fi
            echo "waiting ($i/20)..."; sleep 10
          done
          echo "Live app not healthy"; exit 1
