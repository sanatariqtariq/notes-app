#cloud-config
package_update: true
packages:
  - docker.io
write_files:
  - path: /etc/notes/app.env
    permissions: '0600'
    content: |
      DB_HOST=__DB_HOST__
      DB_PORT=5432
      DB_NAME=notesdb
      DB_USER=notesadmin
      DB_PASSWORD=__DB_PASSWORD__
      DB_SSLMODE=require
  - path: /opt/notes/deploy.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e
      IMAGE=ghcr.io/__GH_USER__/notes-app:latest
      docker pull "$IMAGE"
      docker rm -f notes 2>/dev/null || true
      docker run -d --name notes --restart always --env-file /etc/notes/app.env -p 5000:5000 "$IMAGE"
runcmd:
  - systemctl enable --now docker
  - [ bash, -c, "for i in 1 2 3 4 5; do /opt/notes/deploy.sh && break; sleep 20; done" ]
